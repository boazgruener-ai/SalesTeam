<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>What SalesTeam holds about a person</title>
  <!-- 1.2.4.20 (DATA_PROTECTION_REQUIREMENTS.md R5): the report for a person's access request, saved as a PDF from the
       browser's print dialog. Opened by Settings → Data protection → Find a person → Save as PDF…; the data comes in
       session storage and is gone once read. -->
  <style>
    body { font-family: Arial, Helvetica, sans-serif; font-size: 11pt; color: #111; max-width: 820px; margin: 24px auto; padding: 0 16px; background: #fff; }
    h1 { font-size: 18pt; margin: 0 0 4px; color: #0000ff; }
    h2 { font-size: 13pt; margin: 22px 0 6px; color: #1155cc; border-bottom: 1px solid #ccc; padding-bottom: 3px; }
    h3 { font-size: 11pt; margin: 12px 0 4px; }
    table.meta td { padding: 2px 12px 2px 0; vertical-align: top; }
    table.meta td:first-child { color: #555; white-space: nowrap; }
    dl { margin: 4px 0 10px; display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; }
    dt { color: #555; }
    dd { margin: 0; overflow-wrap: anywhere; }
    .msg { margin: 4px 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .msg b { display: block; color: #555; font-weight: 600; }
    .none { color: #666; font-style: italic; }
    .item { break-inside: avoid; margin-bottom: 10px; }
    .hint { color: #555; font-size: 9.5pt; }
    .print-bar { margin: 0 0 18px; padding: 10px 12px; background: #eef3ff; border: 1px solid #c9d6ff; border-radius: 6px; font-size: 10pt; }
    .print-bar button { margin-left: 8px; }
    @media print { .print-bar { display: none; } body { margin: 0; max-width: none; } }
  </style>
</head>
<body>
  <div class="print-bar">To save the PDF: in the print dialog choose <b>Save as PDF</b> as the destination, then Save.
    <button id="print-btn" type="button">Print / Save as PDF…</button></div>
  <div id="report"><p class="none">Loading…</p></div>
  <script type="module" src="person-report.js"></script>
</body>
</html>
