<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SalesTeam Help</title>
  <link rel="icon" href="icons/icon16.png" />
  <link rel="stylesheet" href="help.css" />
</head>
<body>
  <header id="page-header">
    <h1>SalesTeam Help <span id="version-text"></span></h1>
    <p class="page-subtitle">
      Common questions, and a search that understands more than the exact words - try "disable a search
      topic" or "undo mistake," not just the literal question text.
    </p>
  </header>

  <main id="help-main">
    <input id="help-search-input" type="text" placeholder="Search for anything, e.g. “re-apply negative filters” or “enable topic”…" autofocus />
    <p id="help-no-results" hidden>
      No close match for that - try different words, or browse the full list by clearing the search box.
    </p>
    <div id="help-results"></div>
  </main>

  <script type="module" src="help.js"></script>
</body>
</html>
