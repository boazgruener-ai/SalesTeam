<text x="40" y="914" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5c6b7a">The Scanner both READS and FEEDS the working set — it can only scan accounts that already have a LinkedIn id and a priority, so the readiness bar is what the Scanner needs. Garbage in, garbage out.</text>
